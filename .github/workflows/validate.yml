name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md files
        run: bash scripts/validate-skills.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check bf commands against the bf CLI schema
        run: npx --yes @rotordeck/bf schema --json | python3 scripts/check-bf-commands.py skills
      - name: Validate marketplace manifest
        run: jq empty .claude-plugin/marketplace.json
